site_name: ReduxTC WiFi Portal Docs
site_url: https://wifi.reduxtc.com/docs/
repo_url: https://wifi.reduxtc.com
site_description: End-user documentation for the ReduxTC UniFi Captive Portal platform.

theme:
  name: material
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Getting Started:
      - Cheat Sheet (Production): cheat-sheet.md
      - Production Deployment (Ubuntu 20.04 / DigitalOcean): deployment-ubuntu20-digitalocean.md
      - Initial Setup Wizard: setup-wizard.md
      - Local Development Setup: local-development.md

  - Admin Tasks:
      - Admin Console Overview: admin-console.md
      - Tenant Onboarding: tenant-onboarding.md
      - Site Setup Checklist: site-setup.md
      - Admin Users & Roles: admin-users.md
      - Certificates & TLS: certificates.md
      - Vouchers: vouchers.md
      - Auth Events & Reporting: auth-events.md

  - Integrations:
      - Overview: integrations.md
      - UniFi Setup: unifi-setup.md
      - OIDC SSO (Microsoft Entra ID): oidc-m365.md
      - Email OTP (SMTP): email-otp-smtp.md
      - UniFi Quick Reference: unifi-quickref.md

  - Guest Experience: guest-experience.md
  - Operations & Security: operations-security.md
  - Troubleshooting: troubleshooting.md
