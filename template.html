
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WiFi Portal — {{display_name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🎨 CUSTOMIZATION CONTROLS
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root {
  /* 🖼️ Background Image — Replace with your CDN URL */
  --bg-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?w=1920&q=80');
  
  /* 🎨 Brand Colors */
  --primary-brand: {{connect_button_color}};
  --primary-rgb: 99, 102, 241; /* Update to match your brand */
  
  /* 🏢 Logo URL — Replace with your logo */
  --logo-url: url('{{logo_url}}');
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🎭 FOUNDATION & RESET
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root,
#portal-template-root * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

#portal-template-root {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 100dvh;
  height: 100%;
  font-family: 'Familjen Grotesk', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🌌 ATMOSPHERIC BACKGROUND SYSTEM
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .stage {
  position: absolute;
  inset: 0;
  background: #0a0e1a;
  z-index: 0;
}

#portal-template-root .backdrop {
  position: absolute;
  inset: 0;
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  filter: brightness(0.65) contrast(1.1);
  animation: subtle-zoom 25s ease-in-out infinite alternate;
}

@keyframes subtle-zoom {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

#portal-template-root .atmospheric-overlay {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(var(--primary-rgb), 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
    linear-gradient(180deg, rgba(10, 14, 26, 0.3) 0%, rgba(10, 14, 26, 0.85) 100%);
  backdrop-filter: blur(2px);
}

#portal-template-root .grain-texture {
  position: absolute;
  inset: 0;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='4' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  animation: grain-shift 8s steps(10) infinite;
}

@keyframes grain-shift {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-5%, -5%); }
  20% { transform: translate(-10%, 5%); }
  30% { transform: translate(5%, -10%); }
  40% { transform: translate(-5%, 15%); }
  50% { transform: translate(-15%, 5%); }
  60% { transform: translate(15%, 0%); }
  70% { transform: translate(0%, 15%); }
  80% { transform: translate(-10%, 10%); }
  90% { transform: translate(10%, -5%); }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   💎 GLASSMORPHIC PORTAL CARD
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .portal-container {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

#portal-template-root .portal-card {
  position: relative;
  width: 100%;
  max-width: 460px;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 32px;
  padding: 56px 40px;
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  animation: portal-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  opacity: 0;
}

@keyframes portal-reveal {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

#portal-template-root .portal-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 32px;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.3) 0%,
    rgba(255, 255, 255, 0) 50%,
    rgba(255, 255, 255, 0.1) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🏢 BRAND IDENTITY SECTION
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .brand-lockup {
  text-align: center;
  margin-bottom: 40px;
}

#portal-template-root .logo-frame {
  width: 140px;
  height: 140px;
  margin: 0 auto 28px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  animation: logo-float 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  opacity: 0;
}

@keyframes logo-float {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#portal-template-root .logo-frame::before {
  content: '';
  position: absolute;
  inset: -50%;
  background: conic-gradient(
    from 0deg,
    transparent,
    rgba(var(--primary-rgb), 0.15),
    transparent
  );
  animation: logo-shimmer 4s linear infinite;
}

@keyframes logo-shimmer {
  to { transform: rotate(360deg); }
}

#portal-template-root .logo-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 1;
  content: var(--logo-url);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}

#portal-template-root .network-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.9);
  text-transform: uppercase;
  margin-bottom: 20px;
  animation: badge-slide 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  opacity: 0;
}

@keyframes badge-slide {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

#portal-template-root .signal-icon {
  width: 16px;
  height: 16px;
  display: flex;
  gap: 2px;
  align-items: flex-end;
}

#portal-template-root .signal-bar {
  width: 3px;
  background: rgba(var(--primary-rgb), 0.9);
  border-radius: 2px;
  animation: signal-pulse 1.5s ease-in-out infinite;
}

#portal-template-root .signal-bar:nth-child(1) {
  height: 6px;
  animation-delay: 0s;
}

#portal-template-root .signal-bar:nth-child(2) {
  height: 10px;
  animation-delay: 0.1s;
}

#portal-template-root .signal-bar:nth-child(3) {
  height: 14px;
  animation-delay: 0.2s;
}

@keyframes signal-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   📝 TYPOGRAPHY & MESSAGING
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .hero-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 32px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: #ffffff;
  margin-bottom: 16px;
  text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
  animation: title-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  opacity: 0;
}

@keyframes title-reveal {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#portal-template-root .hero-description {
  font-size: 16px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.75);
  margin-bottom: 36px;
  animation: desc-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  opacity: 0;
}

@keyframes desc-reveal {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#portal-template-root .provider-credit {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.6);
  font-weight: 600;
}

#portal-template-root .provider-name {
  color: rgba(var(--primary-rgb), 1);
  font-weight: 700;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🔘 CONNECT BUTTON — THE HERO MOMENT
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .connect-section {
  margin-bottom: 32px;
  animation: button-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  opacity: 0;
}

@keyframes button-reveal {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#portal-template-root .connect-btn {
  position: relative;
  width: 100%;
  padding: 20px 32px;
  background: var(--primary-brand);
  color: #ffffff;
  border: none;
  border-radius: 16px;
  font-family: 'Familjen Grotesk', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 
    0 8px 24px rgba(var(--primary-rgb), 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

#portal-template-root .connect-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.2) 0%,
    rgba(255, 255, 255, 0) 50%,
    rgba(255, 255, 255, 0.1) 100%
  );
  opacity: 0;
  transition: opacity 0.4s ease;
}

#portal-template-root .connect-btn:hover {
  transform: translateY(-2px);
  box-shadow: 
    0 12px 32px rgba(var(--primary-rgb), 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

#portal-template-root .connect-btn:hover::before {
  opacity: 1;
}

#portal-template-root .connect-btn:active {
  transform: translateY(0);
}

#portal-template-root .connect-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

#portal-template-root .btn-shimmer {
  position: absolute;
  inset: -100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.3),
    transparent
  );
  animation: shimmer-sweep 3s infinite;
}

@keyframes shimmer-sweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   📋 SUPPORT & LEGAL
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .divider {
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.15),
    transparent
  );
  margin: 32px 0 24px;
  animation: divider-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
  opacity: 0;
}

@keyframes divider-reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

#portal-template-root .support-section {
  text-align: center;
  animation: support-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  opacity: 0;
}

@keyframes support-reveal {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#portal-template-root .support-label {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

#portal-template-root .support-contact {
  font-size: 15px;
  color: rgba(255, 255, 255, 0.85);
  font-weight: 600;
  text-decoration: none;
  transition: color 0.3s ease;
}

#portal-template-root .support-contact:hover {
  color: rgba(var(--primary-rgb), 1);
}

#portal-template-root .legal-footer {
  margin-top: 24px;
  font-size: 11px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.4);
  text-align: center;
}

#portal-template-root .legal-footer a {
  color: rgba(255, 255, 255, 0.5);
  text-decoration: none;
  transition: color 0.3s ease;
}

#portal-template-root .legal-footer a:hover {
  color: rgba(255, 255, 255, 0.8);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   📱 RESPONSIVE REFINEMENTS
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media (max-width: 480px) {
  #portal-template-root .portal-card {
    padding: 44px 28px;
  }
  
  #portal-template-root .hero-title {
    font-size: 28px;
  }
  
  #portal-template-root .logo-frame {
    width: 120px;
    height: 120px;
  }
  
  #portal-template-root .connect-btn {
    padding: 18px 28px;
    font-size: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #portal-template-root *,
  #portal-template-root *::before,
  #portal-template-root *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   🎯 STATUS INDICATORS
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#portal-template-root .loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-left: 8px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
  <div id="portal-template-root">
  <!-- 🎬 STAGE & ATMOSPHERE -->
  <div class="stage">
    <div class="backdrop"></div>
    <div class="atmospheric-overlay"></div>
    <div class="grain-texture"></div>
  </div>

  <!-- 🎭 MAIN PORTAL -->
  <div class="portal-container">
    <div class="portal-card">
      
      <!-- 🏢 BRAND SECTION -->
      <div class="brand-lockup">
        <div class="logo-frame">
          <div class="logo-image"></div>
        </div>
        
        <div class="network-badge">
          <div class="signal-icon">
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
          </div>
          Secure Network
        </div>
        
        <h1 class="hero-title">Guest WiFi Access</h1>
        
        <p class="hero-description">
          High-speed internet connectivity provided by 
          <span class="provider-name">{{display_name}}</span>. 
          Tap below to continue.
        </p>
      </div>

      <!-- 🔘 CONNECT ACTION -->
      <div class="connect-section">
        <button 
          type="button" 
          class="connect-btn"
          data-connect-action="tos-accept"
          onclick="handleConnect(this)"
        >
          <span class="btn-shimmer"></span>
          Accept Terms & Connect
        </button>
      </div>

      <!-- 📋 SUPPORT & LEGAL -->
      <div class="divider"></div>
      
      <div class="support-section">
        <div class="support-label">Need Help?</div>
        <a href="mailto:{{support_contact}}" class="support-contact">
          {{support_contact}}
        </a>
      </div>

      <div class="legal-footer">
        By connecting, you agree to our terms of service.<br>
        Connection is monitored and logged for security.
      </div>
    </div>
  </div>
  </div>

  <script>
    // 🔌 CONNECT HANDLER
    async function handleConnect(btn) {
      try {
        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Connecting<span class="loading-spinner"></span>';

        // Helper: read query or hash params
        function qp(name) {
          const search = window.location.search || ('?' + (window.location.hash || '').replace(/^#/, ''));
          return new URLSearchParams(search).get(name);
        }

        // Derive tenant/site from path /guest/s/{tenant}/{site}
        const pathMatch = (window.location.pathname || '').match(/\/guest\/s\/([^\/]+)\/([^\/]+)\/?$/);
        const tenant = pathMatch ? decodeURIComponent(pathMatch[1]) : qp('tenant');
        const site = pathMatch ? decodeURIComponent(pathMatch[2]) : qp('site');
        const portal_session_id = qp('portal_session_id');

        if (!tenant || !site || !portal_session_id) {
          alert('Missing portal/session information. Please relaunch the portal from the Wi-Fi login.');
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }

        const url = `${window.location.origin}/api/guest/${tenant}/${site}/tos/accept`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ portal_session_id })
        });

        let payload = null;
        try { payload = await resp.json(); } catch(e) { /* ignore */ }

        if (!resp.ok) {
          const msg = (payload && (payload.error?.message || payload.message)) || 'Unable to connect.';
          alert(msg);
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }

        const continueUrl = payload?.continue_url || payload?.url || null;
        if (continueUrl) {
          window.location.href = continueUrl;
        } else {
          window.location.reload();
        }
      } catch (err) {
        console.error('Connection error:', err);
        alert(err?.message || 'Network error while connecting.');
        btn.disabled = false;
        btn.innerHTML = 'Accept Terms & Connect';
      }
    }
  </script>
</body>
</html>
