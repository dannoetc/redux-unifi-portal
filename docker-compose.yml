services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: redux_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  openvpn:
    image: kylemanna/openvpn:2.4
    ports:
      - "1194:1194/udp"
    cap_add:
      - NET_ADMIN
    volumes:
      - openvpn_data:/etc/openvpn
      - ./openvpn-init.sh:/usr/local/bin/openvpn-init.sh:ro
    entrypoint: /bin/bash /usr/local/bin/openvpn-init.sh

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/redux_portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-wifi@reduxtc.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ReduxTC WiFi}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery_app worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/redux_portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-wifi@reduxtc.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ReduxTC WiFi}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://dev.reduxtc.com}
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://dev.reduxtc.com}
    expose:
      - "3000"
    depends_on:
      - api

  docs:
    build:
      context: ./docs
    expose:
      - "8000"

  nginx:
    build:
      context: ./frontend/nginx
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN:-wifi.reduxtc.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      - frontend
      - api
      - docs

  certbot:
    image: certbot/certbot:latest
    env_file:
      - .env
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    command: >
      /bin/sh -c "
      CERT_DIR=/etc/letsencrypt/live/${DOMAIN};
      if [ -f $$CERT_DIR/fullchain.pem ] && [ -f $$CERT_DIR/privkey.pem ]; then
        certbot renew --webroot -w /var/www/certbot --non-interactive;
      else
        certbot certonly --webroot -w /var/www/certbot
          --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email --non-interactive
          --keep-until-expiring -d ${DOMAIN};
      fi"
    depends_on:
      - nginx

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
  openvpn_data:
